services:
  mysql:
    image: mysql:8.0
    container_name: codepilot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: codepilot
      MYSQL_USER: codepilot
      MYSQL_PASSWORD: codepilot
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - codepilot_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucodepilot", "-pcodepilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Phase 3: docker compose --profile rag up -d
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codepilot-qdrant
    profiles: ["rag"]
    ports:
      - "6333:6333"
    volumes:
      - codepilot_qdrant_data:/qdrant/storage

volumes:
  codepilot_mysql_data:
  codepilot_qdrant_data:
